<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Jullie gids door Walibi: wat nu doen, hoe er te geraken, waar eten.">
<meta name="theme-color" content="#fff6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171127" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pretpark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<title>Pretpark</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"> Pretpark</div>
  <div class="hdr-right">
    <div class="live" id="livePill" aria-live="polite">…</div>
    <button class="hdr-chat" id="chatBtn" data-go="chat" aria-label="Gezinschat"><span aria-hidden="true">💬</span><span class="badge" id="chatBadge" hidden>0</span></button>
    <label class="hdr-cam" title="Foto nemen"><input type="file" id="hdrCam" accept="image/*" capture="environment" hidden><span aria-hidden="true">📸</span><span class="sr">Foto nemen voor het album</span></label>
  </div>
</header>

<div id="banners" class="banners"></div>

<main>
  <section id="view-now" class="view" aria-label="Nu"></section>
  <section id="view-map" class="view" aria-label="Kaart" hidden></section>
  <section id="view-album" class="view" aria-label="Album" hidden></section>
  <section id="view-tickets" class="view" aria-label="Tickets" hidden></section>
  <section id="view-fam" class="view" aria-label="Gezin" hidden></section>
</main>

<nav class="tabs" aria-label="Schermen">
  <button data-tab="now" aria-current="page"><span aria-hidden="true">✨</span>Nu</button>
  <button data-tab="map"><span aria-hidden="true">🗺️</span>Kaart</button>
  <button data-tab="album"><span aria-hidden="true">📸</span>Album</button>
  <button data-tab="tickets"><span aria-hidden="true">🎟️</span>Tickets</button>
  <button data-tab="fam"><span aria-hidden="true">👨‍👩‍👧‍👦</span>Gezin</button>
</nav>

<!-- full-screen walking guide -->
<div id="guide" class="guide" hidden role="dialog" aria-modal="true" aria-label="Wandelgids"></div>

<!-- family chat -->
<div id="chat" class="chat" hidden role="dialog" aria-modal="true" aria-label="Gezinschat"></div>

<!-- first start: new family or join one, names, who am I -->
<div id="onboard" class="onboard" hidden role="dialog" aria-modal="true" aria-label="Welkom"></div>

<!-- photo viewer and the day's story -->
<div id="pview" class="pview" hidden role="dialog" aria-modal="true" aria-label="Foto"></div>
<div id="story" class="story" hidden role="dialog" aria-modal="true" aria-label="Dagverslag"></div>

<!-- ticket viewer: always white, for the scanner at the gate -->
<div id="tview" class="tview" hidden role="dialog" aria-modal="true" aria-label="Ticket"></div>

<!-- bottom sheet for food, toilets, ride details -->
<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
